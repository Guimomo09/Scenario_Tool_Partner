<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Icône Partner : papier ivoire, marge brique, « P » éditorial (Source Serif 4), repère de scène -->
  <rect x="16" y="16" width="480" height="480" rx="56" fill="#F4F0E8"/>
  <rect x="16" y="16" width="480" height="480" rx="56" fill="none" stroke="#D8D1C5" stroke-width="8"/>
  <!-- marge éditoriale -->
  <rect x="104" y="112" width="14" height="288" fill="#9D4938"/>
  <!-- lettre -->
  <text x="292" y="392" text-anchor="middle" font-family="'Source Serif 4', Georgia, serif" font-weight="600" font-size="360" fill="#25241F">P</text>
  <!-- repère de scène -->
  <rect x="372" y="348" width="44" height="44" fill="#9D4938"/>
</svg>
